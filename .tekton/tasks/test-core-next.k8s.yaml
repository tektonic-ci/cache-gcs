apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cache-gcs-test-core-next
  namespace: tektonic-ci
spec:
  params:
    - name: repo-full-name
      type: string
    - name: revision
      type: string
  stepTemplate:
    computeResources:
      limits:
        cpu: "1"
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    workingDir: $(workspaces.workspace.path)
  steps:
    - env: []
      image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: report-running
      onError: continue
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        def post-status [label: string, body: record]: nothing -> bool {
          let url = $"https://api.github.com/repos/$(params.repo-full-name)/statuses/$(params.revision)"
          log $"($label): POST ($url)"
          log $"($label): body: ($body | to json -r)"
          try {
            http post $url $body -t application/json -H [
              Authorization $"token ($env.GITHUB_TOKEN)"
              Accept "application/vnd.github+json"
            ]
            log $"($label): done"
            true
          } catch { |e|
            log $"($label): error: ($e.msg)"
            false
          }
        }

        try { date now | format date '%s' | save -f /tekton/home/.status-started-at } catch { |e| log $"report-running: cannot record start time: ($e.msg)" }

        let body = { state: "pending", context: "test-core-next", description: "Running" }
        post-status "report-running [test-core-next]" $body | ignore
    - image: ghcr.io/pfenerty/apko-cicd/nodejs:24
      name: test
      onError: continue
      script: |-
        #!/bin/sh
        log() { printf '[%s] %s\n' "$(date +%H:%M:%S)" "$*"; }
        [ -e /tekton/home/.exit-code ] || printf '%s' 0 > /tekton/home/.exit-code
        chmod 0666 /tekton/home/.exit-code 2>/dev/null || true
        (
        set -e
        dir=$(mktemp -d)
        tar --exclude=node_modules -cf - . | tar -xf - -C "$dir"
        cd "$dir"
        npm ci
        # Core moves "next" only on a prerelease, so after a stable release it trails
        # "latest" and would test an older core than the lock file. Take the newer.
        next=$(npm view @tektonic-ci/core@next version)
        latest=$(npm view @tektonic-ci/core@latest version)
        core=$(node -e '
            const key = (v) => { const [rel, pre] = v.split("-"); return [...rel.split(".").map(Number), pre === undefined ? 1 : 0]; };
            const [a, b] = process.argv.slice(1);
            const [ka, kb] = [key(a), key(b)];
            const i = ka.findIndex((x, j) => x !== kb[j]);
            console.log(i === -1 || ka[i] > kb[i] ? a : b);
        ' "$next" "$latest")
        echo "core@next is $next, core@latest is $latest: testing $core"
        npm install --no-save "@tektonic-ci/core@$core"
        npm ls @tektonic-ci/core
        npm test
        )
        __tek_rc=$?
        if [ "$__tek_rc" -ne 0 ]; then log "error [test-core-next/test]: exited with status $__tek_rc"; fi
        __tek_prev=$(cat /tekton/home/.exit-code 2>/dev/null || echo 0)
        if [ "$__tek_rc" -gt "$__tek_prev" ]; then __tek_prev="$__tek_rc"; fi
        printf '%s' "$__tek_prev" > /tekton/home/.exit-code
        exit "$__tek_rc"
      workingDir: $(workspaces.workspace.path)
    - env: []
      image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: report-status
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        def format-duration [secs: int]: nothing -> string {
          let secs = ([$secs 0] | math max)
          let h = $secs // 3600
          let m = ($secs mod 3600) // 60
          let s = $secs mod 60
          let pad = { |n| $n | into string | fill -a right -w 2 -c '0' }
          if $h > 0 {
            $"($h)h(do $pad $m)m"
          } else if $m > 0 {
            $"($m)m(do $pad $s)s"
          } else {
            $"($s)s"
          }
        }

        let contract_code = (try { open --raw /tekton/home/.exit-code | str trim | into int } catch { 1 })
        # A step that never ran has no file; 0 keeps it out of the max.
        let step_codes = ([{ name: "test", path: "/tekton/steps/step-test/exitCode" }] | each { |s| { name: $s.name, code: (try { open --raw $s.path | str trim | into int } catch { 0 }) } })
        let exit_code = ([$contract_code ...($step_codes | each { |s| $s.code })] | math max)
        let state = if $exit_code == 0 { "success" } else { "failure" }
        # Name the first step that failed, so the check says where without opening the logs.
        let failed_steps = ($step_codes | where code != 0)
        let result = if $exit_code == 0 {
          "Passed"
        } else if ($failed_steps | is-empty) {
          $"Failed: exit ($exit_code)"
        } else {
          let first = ($failed_steps | first)
          $"Failed: step ($first.name) exited ($first.code)"
        }
        # Only a start step records the start time; without one the description carries no duration.
        let duration = (try { format-duration ((date now | format date '%s' | into int) - (open --raw /tekton/home/.status-started-at | str trim | into int)) } catch { null })
        let desc = if $duration == null {
          $result
        } else if $exit_code == 0 {
          $"Passed in ($duration)"
        } else {
          $"($result) \(($duration)\)"
        }

        log $"report-status [test-core-next]: exit-code=($exit_code) state=($state)"

        let url = $"https://api.github.com/repos/$(params.repo-full-name)/statuses/$(params.revision)"
        let body = { state: $state, context: "test-core-next", description: $desc }

        log $"report-status [test-core-next]: POST ($url)"
        log $"report-status [test-core-next]: body: ($body | to json -r)"

        try {
          http post $url $body -t application/json -H [
            Authorization $"token ($env.GITHUB_TOKEN)"
            Accept "application/vnd.github+json"
          ]
          log "report-status [test-core-next]: done"
        } catch { |e|
          log $"report-status [test-core-next]: error: ($e.msg)"
        }
  workspaces:
    - name: workspace
