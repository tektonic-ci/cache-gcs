apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cache-gcs-test-core-next
  namespace: tektonic-ci
spec:
  params:
    - name: repo-full-name
      type: string
    - name: revision
      type: string
  stepTemplate:
    computeResources:
      limits:
        cpu: "1"
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    workingDir: $(workspaces.workspace.path)
  steps:
    - image: ghcr.io/pfenerty/apko-cicd/nodejs:24
      name: test
      onError: continue
      script: |-
        #!/bin/sh
        log() { printf '[%s] %s\n' "$(date +%H:%M:%S)" "$*"; }
        [ -e /tekton/home/.exit-code ] || printf '%s' 0 > /tekton/home/.exit-code
        chmod 0666 /tekton/home/.exit-code 2>/dev/null || true
        (
        set -e
        dir=$(mktemp -d)
        tar --exclude=node_modules -cf - . | tar -xf - -C "$dir"
        cd "$dir"
        npm ci
        npm install --no-save @tektonic-ci/core@next
        npm ls @tektonic-ci/core
        npm test
        )
        __tek_rc=$?
        if [ "$__tek_rc" -ne 0 ]; then log "error [test-core-next/test]: exited with status $__tek_rc"; fi
        __tek_prev=$(cat /tekton/home/.exit-code 2>/dev/null || echo 0)
        if [ "$__tek_rc" -gt "$__tek_prev" ]; then __tek_prev="$__tek_rc"; fi
        printf '%s' "$__tek_prev" > /tekton/home/.exit-code
        exit "$__tek_rc"
      workingDir: $(workspaces.workspace.path)
    - env: []
      image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: report-status
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        let contract_code = (try { open --raw /tekton/home/.exit-code | str trim | into int } catch { 1 })
        # A step that never ran has no file; 0 keeps it out of the max.
        let step_codes = (["/tekton/steps/step-test/exitCode"] | each { |p| try { open --raw $p | str trim | into int } catch { 0 } })
        let exit_code = ([$contract_code ...$step_codes] | math max)
        let state = if $exit_code == 0 { "success" } else { "failure" }
        let desc = if $exit_code == 0 { "Passed" } else { "Failed" }

        log $"report-status [test-core-next]: exit-code=($exit_code) state=($state)"

        let url = $"https://api.github.com/repos/$(params.repo-full-name)/statuses/$(params.revision)"
        let body = { state: $state, context: "test-core-next", description: $desc }

        log $"report-status [test-core-next]: POST ($url)"
        log $"report-status [test-core-next]: body: ($body | to json -r)"

        try {
          http post $url $body -t application/json -H [
            Authorization $"token ($env.GITHUB_TOKEN)"
            Accept "application/vnd.github+json"
          ]
          log "report-status [test-core-next]: done"
        } catch { |e|
          log $"report-status [test-core-next]: error: ($e.msg)"
        }
  workspaces:
    - name: workspace
